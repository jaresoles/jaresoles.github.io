---
layout: default
---

<article class="find">
  <h1>{{ page.title }}</h1>

  <div class="date">{{ page.date | date: "%B %e, %Y" }}</div>

  {% if page.image %}
    <img src="{{ site.baseurl }}{{ page.image }}" alt="{{ page.title }}" class="find-photo">
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>

  <a href="{{ site.baseurl }}/finds/" class="read-more">&larr; Back to all finds</a>
</article>
